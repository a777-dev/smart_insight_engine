[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#070C18"
secondaryBackgroundColor = "#0D1424"
textColor = "#F0F4FF"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 200
maxMessageSize = 200

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"
